# Flatpak manifest for the Vireo BETA channel — same self-hosted repo as stable
# (vireo.hyprlab.co/flatpak), published under the ostree branch "beta" with app
# ID co.hyprlab.Vireo.Beta so it installs alongside the stable app. Built with
# the `beta` cargo feature: "Vireo (beta)" branding, a b-suffixed version, and
# XDG dirs redirected into the stable app's ~/.var/app tree so both installs
# share accounts, settings and the mail cache. x86_64 only — no ARM beta.
#
# Ship it with (see the beta ship workflow):
#   flatpak-builder --user --force-clean --disable-rofiles-fuse \
#     --repo=dist/repo --default-branch=beta \
#     --gpg-sign=$(cat dist/keyid.txt) --gpg-homedir=dist/gpg-home \
#     --mirror-screenshots-url=https://dl.flathub.org/media \
#     dist/build-dir-beta co.hyprlab.Vireo.Beta.yml
id: co.hyprlab.Vireo.Beta
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vireo

finish-args:
  - --share=ipc
  - --share=network                              # IMAP/SMTP, OAuth loopback, Gravatar
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri                                 # WebKit rendering
  - --talk-name=org.freedesktop.secrets          # keyring: passwords + OAuth tokens
  - --talk-name=org.gnome.OnlineAccounts          # import GNOME Online Accounts
  - --talk-name=org.gnome.Settings                 # "Open Online Accounts" button
  - --talk-name=org.gnome.evolution.dataserver.*  # GNOME Contacts (Evolution Data Server)
  - --talk-name=org.gnome.Contacts                 # "Open GNOME Contacts" button (D-Bus activation)
  # Deliberately NOT --talk-name=org.freedesktop.Flatpak — see the stable
  # manifest for why (it would permit arbitrary host command execution).
  # Read the host's Evolution Data Server address books.
  - --filesystem=xdg-data/evolution:ro
  - --filesystem=xdg-cache/evolution:ro
  - --filesystem=xdg-config/evolution:ro
  # THE beta twist: read-write access to the stable app's sandbox tree. The
  # beta binary redirects its config/cache/data base dirs there (see
  # `shared_base` in src/config.rs), so beta testers keep their accounts,
  # settings and cached mail without a second setup.
  # :create makes flatpak create the stable app's directory on the HOST when
  # it doesn't exist yet — without it the grant is silently skipped on
  # beta-only installs and the shared home pointed at the sandbox's throwaway
  # tmpfs, losing accounts on quit (issue #83). With it, a beta-first install
  # establishes the standard persistent home that a later stable install picks
  # up natively; install order no longer matters.
  - --filesystem=~/.var/app/co.hyprlab.Vireo:create
  # Read the old Veem app's data so first-run migration matches stable's.
  - --filesystem=~/.var/app/com.getveem.Veem:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vireo/cargo

modules:
  # PDF attachment thumbnails render via poppler-glib — same modules as the
  # stable manifest; keep the two in sync.
  - name: popplerdata
    no-autogen: true
    make-install-args:
      - prefix=/app
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DCMAKE_INSTALL_INCLUDEDIR=/app/include
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_LIBOPENJPEG=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.07.0.tar.xz
        sha256: 304832f48f8a47fdca90c6b6d1f684e68f37c10c9a0726f345f4ca9df4ca01e2
  # Spell-checking dictionaries beyond the runtime's English (#114): a modest
  # set of common languages from LibreOffice's collection, installed under
  # /app/share/hunspell where enchant (and so both the composer body's WebKit
  # checker and the subject line's) finds them via XDG_DATA_DIRS. Renamed to
  # canonical lang_REGION codes so enchant's tag lookup matches. Languages
  # beyond these still come via the runtime locale extension
  # (flatpak config --set extra-languages).
  - name: hunspell-dictionaries
    buildsystem: simple
    build-commands:
      - install -d /app/share/hunspell
      - install -m644 de/de_DE_frami.dic /app/share/hunspell/de_DE.dic
      - install -m644 de/de_DE_frami.aff /app/share/hunspell/de_DE.aff
      - install -m644 es/es_ES.dic es/es_ES.aff /app/share/hunspell/
      - install -m644 fr_FR/dictionaries/fr.dic /app/share/hunspell/fr_FR.dic
      - install -m644 fr_FR/dictionaries/fr.aff /app/share/hunspell/fr_FR.aff
      - install -m644 it_IT/it_IT.dic it_IT/it_IT.aff /app/share/hunspell/
      - install -m644 nl_NL/nl_NL.dic nl_NL/nl_NL.aff /app/share/hunspell/
      - install -m644 pl_PL/pl_PL.dic pl_PL/pl_PL.aff /app/share/hunspell/
      - install -m644 pt_BR/pt_BR.dic pt_BR/pt_BR.aff /app/share/hunspell/
      - install -m644 pt_PT/pt_PT.dic pt_PT/pt_PT.aff /app/share/hunspell/
      - install -m644 ru_RU/ru_RU.dic ru_RU/ru_RU.aff /app/share/hunspell/
      - install -m644 sv_SE/dictionaries/sv_SE.dic /app/share/hunspell/sv_SE.dic
      - install -m644 sv_SE/dictionaries/sv_SE.aff /app/share/hunspell/sv_SE.aff
      - install -m644 uk_UA/uk_UA.dic uk_UA/uk_UA.aff /app/share/hunspell/
    sources:
      - type: archive
        url: https://github.com/LibreOffice/dictionaries/archive/32b006a2c22a4ac7e8ed3f03346f7b3d85a970a4.tar.gz
        sha256: cbd790eca560de5e8ec8bd64117a00dfd0bc06b091c8f52d23e44ea00d3e8461
  - name: vireo
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --features beta --verbose
      - install -Dm755 target/release/vireo /app/bin/vireo
      - install -Dm644 data/co.hyprlab.Vireo.Beta.desktop /app/share/applications/co.hyprlab.Vireo.Beta.desktop
      - install -Dm644 data/icons/hicolor/256x256/apps/co.hyprlab.Vireo.Beta.png /app/share/icons/hicolor/256x256/apps/co.hyprlab.Vireo.Beta.png
      - install -Dm644 data/icons/hicolor/512x512/apps/co.hyprlab.Vireo.Beta.png /app/share/icons/hicolor/512x512/apps/co.hyprlab.Vireo.Beta.png
      - install -Dm644 data/co.hyprlab.Vireo.Beta.metainfo.xml /app/share/metainfo/co.hyprlab.Vireo.Beta.metainfo.xml
    sources:
      - type: git
        url: https://github.com/hyprlab/vireo.git
        tag: v1.19.3-beta.1
        commit: 0a3f7b6a0b91b4104af351b5933d1ec4b21d3e1d
      # Vendored crate sources for the offline Flatpak build. Generate with:
      #   flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - cargo-sources.json

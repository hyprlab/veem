# Snap package for Vireo. Built by tools/build-packages.sh inside the
# ghcr.io/canonical/snapcraft container (destructive mode, SDK snaps unpacked
# by packaging/snap/prepare-sdk.sh). Version is synced from Cargo.toml.
name: vireo
version: '1.6.1'
summary: A clean, fast GNOME-native email client
description: |
  Vireo is a desktop email client for Wayland that feels at home in GNOME.
  It talks IMAP and SMTP directly, keeps your mail and credentials on your
  machine, and blocks trackers by default — no telemetry, no analytics.

  Veem was renamed Vireo in v1.6.0.
license: AGPL-3.0-or-later
grade: stable
confinement: strict
base: core24
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

parts:
  vireo:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - pkg-config
      - libssl-dev
    organize:
      bin/vireo: usr/bin/vireo
    override-build: |
      craftctl default
      install -Dm644 data/co.hyprlab.Vireo.desktop $CRAFT_PART_INSTALL/usr/share/applications/co.hyprlab.Vireo.desktop
      install -Dm644 data/co.hyprlab.Vireo.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/co.hyprlab.Vireo.metainfo.xml
      install -Dm644 data/icons/hicolor/256x256/apps/co.hyprlab.Vireo.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/co.hyprlab.Vireo.png
      install -Dm644 data/icons/hicolor/512x512/apps/co.hyprlab.Vireo.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/co.hyprlab.Vireo.png

apps:
  vireo:
    command: usr/bin/vireo
    extensions: [gnome]
    desktop: usr/share/applications/co.hyprlab.Vireo.desktop
    common-id: co.hyprlab.Vireo
    plugs:
      - network
      - password-manager-service
